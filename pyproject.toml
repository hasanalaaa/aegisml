[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisml-scanner"
version = "3.0.0"
description = "Offline, no-execution security scanner for AI model artifacts: pickle call-graph reconstruction, deep format parsing, tensor forensics"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AegisML Contributors" }]
keywords = ["ai", "security", "ml", "model", "scanner", "malware", "gguf", "safetensors",
            "llm", "pickle", "onnx", "keras", "supply-chain", "sarif", "mlsecops"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
remote = ["httpx>=0.27.0"]
ai = ["anthropic>=0.40.0"]
dev = ["build>=1.2.0", "httpx>=0.27.0", "pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
aegisml = "aegisml_scanner.cli:main"

[project.urls]
Homepage      = "https://aegisml.vercel.app"
Repository    = "https://github.com/hasanalaaa/aegisml"
Documentation = "https://github.com/hasanalaaa/aegisml#readme"

[tool.setuptools.packages.find]
include = ["aegisml_scanner*"]

[tool.pytest.ini_options]
testpaths = ["tests", "services/scan-engine/tests"]
pythonpath = [".", "services/scan-engine"]
