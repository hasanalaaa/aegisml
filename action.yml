name: AegisML model security scan
description: Scan a local AI model artifact with the code from this exact action revision
author: AegisML Contributors

branding:
  icon: shield
  color: yellow

inputs:
  model-path:
    description: Local model file or directory to scan
    required: true
  fail-on:
    description: Minimum finding severity that fails the job (critical, high, medium, low, never)
    required: false
    default: critical
  entropy:
    description: Entropy mode (auto, full, off)
    required: false
    default: auto
  signatures:
    description: >-
      Signature tier. "full" checks every byte against every signature;
      "adaptive" checks structural regions, nested payloads and text-bearing
      blocks; "auto" picks full below 2 GiB.
    required: false
    default: auto

outputs:
  risk_score:
    description: Highest risk score across scanned artifacts
    value: ${{ steps.scan.outputs.risk_score }}
  risk_level:
    description: Risk level for the highest-risk artifact
    value: ${{ steps.scan.outputs.risk_level }}
  verdict:
    description: Deterministic verdict for the highest-risk artifact
    value: ${{ steps.scan.outputs.verdict }}
  findings:
    description: Total finding count
    value: ${{ steps.scan.outputs.findings }}
  scan_id:
    description: Scan identifier for the highest-risk artifact
    value: ${{ steps.scan.outputs.scan_id }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install this action revision
      shell: bash
      run: |
        python -m pip install --disable-pip-version-check --no-deps "$GITHUB_ACTION_PATH"
        python - <<'PY'
        from importlib import metadata

        distribution = metadata.distribution("aegisml-scanner")
        assert distribution.metadata["Name"] == "aegisml-scanner"
        assert not any(str(path).startswith("aegisml/") for path in distribution.files or [])
        PY

    - name: Scan model artifact
      id: scan
      shell: bash
      env:
        AEGISML_ACTION_MODEL_PATH: ${{ inputs.model-path }}
        AEGISML_ACTION_FAIL_ON: ${{ inputs.fail-on }}
        AEGISML_ACTION_ENTROPY: ${{ inputs.entropy }}
        AEGISML_ACTION_SIGNATURES: ${{ inputs.signatures }}
      run: |
        result_file="$RUNNER_TEMP/aegisml-result.json"
        set +e
        aegisml scan "$AEGISML_ACTION_MODEL_PATH" \
          --format json \
          --output "$result_file" \
          --fail-on "$AEGISML_ACTION_FAIL_ON" \
          --entropy "$AEGISML_ACTION_ENTROPY" \
          --signatures "$AEGISML_ACTION_SIGNATURES" \
          --quiet
        scan_status=$?
        set -e

        if [[ $scan_status -eq 2 ]]; then
          echo "AegisML operational failure; no security verdict was produced." >&2
          exit 2
        fi
        if [[ $scan_status -ne 0 && $scan_status -ne 1 ]]; then
          echo "Unexpected AegisML exit code: $scan_status" >&2
          exit 2
        fi
        if [[ ! -s "$result_file" ]]; then
          echo "AegisML did not produce a result file." >&2
          exit 2
        fi

        RESULT_FILE="$result_file" python - <<'PY'
        import json
        import os

        with open(os.environ["RESULT_FILE"], encoding="utf-8") as stream:
            payload = json.load(stream)
        results = payload if isinstance(payload, list) else [payload]
        if not results:
            summary = {"risk_score": 0, "risk_level": "clean", "verdict": "SAFE", "scan_id": ""}
            findings = 0
        else:
            required = {"risk_score", "risk_level", "verdict", "scan_id", "threats", "metadata"}
            if any(not isinstance(item, dict) or not required.issubset(item) for item in results):
                raise SystemExit("Invalid AegisML result schema")
            if any(not item["metadata"].get("coverage", {}).get("complete") for item in results):
                raise SystemExit("AegisML result is incomplete")
            summary = max(results, key=lambda item: float(item["risk_score"]))
            findings = sum(len(item["threats"]) for item in results)

        output = os.environ["GITHUB_OUTPUT"]
        with open(output, "a", encoding="utf-8") as stream:
            stream.write(f"risk_score={summary['risk_score']}\n")
            stream.write(f"risk_level={summary['risk_level']}\n")
            stream.write(f"verdict={summary['verdict']}\n")
            stream.write(f"findings={findings}\n")
            stream.write(f"scan_id={summary['scan_id']}\n")

        step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
        if step_summary:
            with open(step_summary, "a", encoding="utf-8") as stream:
                stream.write("## AegisML security scan\n\n")
                stream.write(f"- Verdict: **{summary['verdict']}**\n")
                stream.write(f"- Risk: **{summary['risk_score']}/100**\n")
                stream.write(f"- Findings: **{findings}**\n")
        PY

        exit "$scan_status"
