name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            services/scan-engine/requirements.txt

      - name: Install development dependencies
        run: >-
          python -m pip install --disable-pip-version-check ".[dev]"
          "bandit==1.9.4" "pip-audit==2.10.1" "ruff==0.16.0"

      - name: Check critical Python lint rules
        run: ruff check aegisml_scanner tests services/scan-engine --exclude services/scan-engine/migrations --select E9,F63,F7,F82

      - name: Scan Python source for medium and high security findings
        run: bandit -q -r aegisml_scanner services/scan-engine -x services/scan-engine/tests,services/scan-engine/migrations -ll

      - name: Audit service dependencies
        run: pip-audit -r services/scan-engine/requirements.txt

      - name: Run full test suite
        run: python -m pytest

      - name: Build source and wheel distributions
        run: python -m build

      - name: Smoke-test the built wheel and CLI
        run: |
          smoke_venv="$RUNNER_TEMP/aegisml-wheel-smoke"
          python -m venv "$smoke_venv"
          "$smoke_venv/bin/python" -m pip install --disable-pip-version-check --no-deps dist/*.whl
          "$smoke_venv/bin/aegisml" doctor --json
          "$smoke_venv/bin/aegisml" scan tests/fixtures/clean.model --format json --fail-on never --quiet

  web:
    name: Web checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.3
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production web dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Run web contract tests
        run: pnpm test

      - name: Run web lint
        run: pnpm lint

      - name: Run TypeScript checks
        run: pnpm exec tsc --noEmit --incremental false

      - name: Build web application
        run: pnpm build

  action-smoke:
    name: Local action smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Scan clean fixture with the local action
        id: scan
        uses: ./
        with:
          model-path: tests/fixtures/clean.model
          fail-on: never

      - name: Validate action outputs
        env:
          RISK_SCORE: ${{ steps.scan.outputs.risk_score }}
          RISK_LEVEL: ${{ steps.scan.outputs.risk_level }}
          VERDICT: ${{ steps.scan.outputs.verdict }}
          FINDINGS: ${{ steps.scan.outputs.findings }}
          SCAN_ID: ${{ steps.scan.outputs.scan_id }}
        run: |
          test -n "$RISK_SCORE"
          test -n "$RISK_LEVEL"
          test -n "$VERDICT"
          test -n "$FINDINGS"
          test -n "$SCAN_ID"
